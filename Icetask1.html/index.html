<!DOCTYPE html>
<html>
<head>
    <title>HTML Questions and Answers</title>

    <style>
        body {
            background-color: white;
            font-family: Arial;
        }

        .box {
            width: 520px;
            margin: 80px auto;
            border: 3px solid #333;
            box-shadow: 5px 5px 10px gray;
        }

        .title {
            background-color: #a6e000;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .orange {
            background-color: #d94b00;
            color: white;
            padding: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .green {
            background-color: #9ee37d;
            padding: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .question {
            background-color: white;
            padding: 15px;
            font-size: 18px;
        }

        .answer {
            background-color: white;
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="title">
            Html<br><br>
            Questions and Answers
        </div>

        <div class="orange">
            Prepare for Interview
        </div>

        <div class="green">
            Question:
        </div>

        <div class="question">
            Explain anchor tag in HTML ?
        </div>

        <div class="green">
            Answer:
        </div>

        <div class="answer">
            The &lt;a&gt; tag defines an anchor. It can be used to create a
            link to another document by using the href attribute or to create
            a bookmark inside a document, by using the name or id attribute.
        </div>

    </div>

</body>
</html>
